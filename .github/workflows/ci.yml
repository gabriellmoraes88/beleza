name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migração e testes SQL
        run: |
          createdb beleza_test
          psql -d beleza_test -v ON_ERROR_STOP=1 -q \
            -f supabase/tests/stub_supabase.sql \
            $(for f in supabase/migrations/*.sql; do printf -- "-f %s " "$f"; done)
          psql -d beleza_test -v ON_ERROR_STOP=1 -q -f supabase/tests/agendamento_test.sql | tee out.txt
          grep -q "TODOS OS TESTES PASSARAM" out.txt
